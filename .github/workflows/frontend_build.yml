name: Build Frontend

on:
    - workflow_dispatch
    - workflow_call

permissions: 
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./apps/astro-server

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GHCR_PASSWORD }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build and Push to GitHub Container Registry
              uses: docker/build-push-action@v6
              with:
                  context: ./apps/astro-server
                  file: ./apps/astro-server/dockerfile
                  push: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  tags: |
                      ghcr.io/${{ secrets.GHCR_TAG }}/frontend:latest
                      ghcr.io/${{ secrets.GHCR_TAG }}/frontend:${{ github.sha }}
            
