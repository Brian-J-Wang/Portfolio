name: Deploy

on:
    - workflow_dispatch
    - workflow_call

permissions:
    contents: read
    packages: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Create Env Variables
              run: |
                cat > .env.backend << EOF
                DB_USER=${{ secrets.DB_USER }}
                DB_PASS=${{ secrets.DB_PASS }}
                DB_HOST=${{ secrets.DB_HOST }}
                GH_TOKEN=${{ secrets.GH_TOKEN }}
                EOF
            - name: Create Mongo Env Variables
              run: |
                cat > .env.mongo << EOF
                MONGODB_INITDB_ROOT_USERNAME=${{ secrets.DB_USER }}
                MONGODB_INITDB_ROOT_PASSWORD=${{ secrets.DB_PASS }}
                EOF
            - name: Copy Compose File to VPS
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  source: "docker-compose.yml,.env.backend,.env.mongo"
                  target: "/home/${{secrets.VPS_USER}}/"
                  overwrite: true
            - name: Login to VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                    echo "${{ secrets.GHCR_PASSWORD }}" | docker login ghcr.io -u ${{ secrets.GHCR_NAME }} --password-stdin
                    docker compose pull
                    docker compose up -d --remove-orphans