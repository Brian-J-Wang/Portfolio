name: Build Backend

on:
    - workflow_dispatch
    - workflow_call

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./apps/github-service
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GHCR_PASSWORD }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build and push to GHCR
              uses: docker/build-push-action@v6
              with:
                  context: ./apps/github-service
                  file: ./apps/github-service/Dockerfile
                  push: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  tags: |
                      ghcr.io/${{ secrets.GHCR_TAG }}/backend:latest
                      ghcr.io/${{ secrets.GHCR_TAG }}/backend:${{ github.sha }}
