name: CI_frontend

on:
	push:
		branches: [ main ]
		paths:
			- "apps/astro-server/**"

jobs:
	lint:
		runs-on: ubuntu-latest
		defaults:
			run:
				working-directory: apps/astro-server
		steps:
			- name: Checkout
				uses: actions/checkout@v4
			- name: Set up Node.js
				uses: actions/setup-node@v4
				with:
					node-version: '24.x'
			- name: Install dependencies
				run: npm ci
			- name: Check formatting
				run: npx prettier --check "**/*.{js,ts,astro,css}"