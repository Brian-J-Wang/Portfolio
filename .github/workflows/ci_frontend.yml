name: CI_frontend

on:
    push:
        branches:
            - main
        paths:
            - "apps/astro-server/**"
            - ".github/workflows/ci_frontend.yml"

permissions:
    contents: read
    packages: write

jobs:
    lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/astro-server
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
            - name: Install dependencies
              run: npm ci
            - name: Check formatting
              run: npx prettier --check "**/*.{js,ts,astro,css}"

    build:
        runs-on: ubuntu-latest
        needs: lint
        defaults:
            run:
                working-directory: apps/astro-server
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
                  cache: "npm"
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GHCR_PASSWORD }}
            - name: Extract Docker image name
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build and Push to GitHub Container Registry
              uses: docker/build-push-action@v6
              with:
                  context: ./apps/astro-server
                  push: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  tags: |
                      ${{ steps.meta.outputs.tags }}/frontend:latest
                      ${{ steps.meta.outputs.tags }}/frontend:${{ github.sha }}
