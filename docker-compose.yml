services:
  frontend:
    image: ghcr.io/brian-j-wang/portfolio/frontend:latest
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:4000
  backend:
    image: ghcr.io/brian-j-wang/portfolio/backend:latest
    ports:
      - "4000:4000"
    env_file:
      - .env.backend
    depends_on:
      - mongo_db
  mongo_db:
    image: mongo:8.0
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    env_file:
      - .env.mongo

volumes:
  mongo_data: